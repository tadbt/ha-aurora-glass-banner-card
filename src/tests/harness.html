<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Glass Banner Card — Editable Test Harness</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b1020; font-family: system-ui, sans-serif; color: #e2e8f0; }
  .wrap { max-width: 1040px; margin: 28px auto; padding: 0 16px 40px; display: grid; gap: 18px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, input[type="text"] {
    padding: 7px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #f8fafc; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; font-weight: 600; }
  button:hover, select:hover, input[type="text"]:hover { border-color: #7c5cff; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  .panel {
    display: grid; gap: 12px; padding: 16px; border-radius: 14px;
    border: 1px solid #334155; background: #0f172a;
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .field { display: grid; gap: 5px; font-size: 12px; color: #94a3b8; }
  .field label { font-weight: 600; }
  .checks { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  textarea {
    width: 100%; min-height: 260px; padding: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #090e1c; color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5;
    box-sizing: border-box; resize: vertical;
  }
  textarea.small { min-height: 92px; }
  .err { color: #fb7185; font-size: 13px; min-height: 18px; }
  .mini-btns { display: flex; gap: 6px; }
  .mini-btns button { padding: 4px 9px; font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="toggle-theme" type="button">Toggle Light/Dark</button>
    <button id="toggle-rain" type="button">Toggle Rain</button>
    <button id="toggle-light" type="button">Toggle Living Light</button>
    <button id="toggle-door" type="button">Toggle Front Door</button>
    <button id="toggle-motion" type="button">Toggle Motion</button>
  </div>

  <aurora-glass-banner-card id="card"></aurora-glass-banner-card>

  <div class="panels">
    <div class="panel">
      <div class="panel-head">
        <span>Visual Editor</span>
        <span style="font-weight:500;text-transform:none;letter-spacing:0">Live-synced with YAML</span>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="ed-world">World</label>
          <select id="ed-world"></select>
        </div>
        <div class="field">
          <label for="ed-effect">Weather / Effect</label>
          <select id="ed-effect"></select>
        </div>
        <div class="field">
          <label for="ed-theme">Theme</label>
          <select id="ed-theme">
            <option value="auto">Auto</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="field">
          <label for="ed-weather">Weather Entity</label>
          <input id="ed-weather" type="text" placeholder="weather.home">
        </div>
      </div>

      <div class="field">
        <label for="ed-name">Name / Label</label>
        <input id="ed-name" type="text" placeholder="Optional custom greeting/label">
      </div>

      <div class="checks">
        <label><input id="ed-clock" type="checkbox"> Show clock</label>
        <label><input id="ed-date" type="checkbox"> Show date</label>
        <label><input id="ed-tag" type="checkbox"> Show world tag</label>
        <label><input id="ed-24h" type="checkbox"> 24-hour clock</label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>Home Assistant Card YAML</span>
        <button id="apply-yaml" type="button">Apply YAML</button>
      </div>
      <textarea id="yaml-input" spellcheck="false">type: custom:aurora-glass-banner-card
world: casetta
effect: auto
weather_entity: weather.home
theme: auto
show_date: true
show_clock: true
show_world_tag: true
hour_24: true
badges:
  - entity: weather.home
    attribute: temperature
    name: Outside
  - entity: sensor.house_power
    name: Power
  - entity: binary_sensor.living_motion
    name: Motion
  - binary_sensor.front_door
  - entity: light.living_room
    tap_action:
      action: toggle</textarea>
      <div class="err" id="yaml-err"></div>
    </div>
  </div>
</div>

<script src="../../aurora-glass-banner-card.js"></script>
<script>
  // Minimal YAML parser for HA card config (supports maps, lists, block scalars |, booleans, numbers, strings)
  function parseYaml(src) {
    var rawLines = src.replace(/\r\n/g, "\n").split("\n");
    var lines = [];
    for (var r = 0; r < rawLines.length; r++) {
      var raw = rawLines[r];
      var clean = raw.replace(/\s+#.*$/, "");
      var trimmed = clean.trim();
      if (!trimmed || trimmed[0] === "#") continue;
      lines.push({ indent: clean.search(/\S/), text: trimmed, raw: raw, line: r + 1 });
    }

    function scalar(v) {
      if (v === "true") return true;
      if (v === "false") return false;
      if (v === "null" || v === "~") return null;
      if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
      if ((v[0] === '"' && v[v.length - 1] === '"') || (v[0] === "'" && v[v.length - 1] === "'")) return v.slice(1, -1);
      return v;
    }

    var i = 0;
    function parseBlock(minIndent) {
      if (i >= lines.length) return {};
      if (lines[i].text.indexOf("- ") === 0 || lines[i].text === "-") {
        var arr = [];
        var listIndent = lines[i].indent;
        while (i < lines.length && lines[i].indent === listIndent && (lines[i].text.indexOf("- ") === 0 || lines[i].text === "-")) {
          var rest = lines[i].text.slice(1).trim();
          i++;
          if (!rest) {
            arr.push(parseBlock(listIndent + 1));
          } else if (rest.indexOf(":") > 0) {
            var ci = rest.indexOf(":");
            var k = rest.slice(0, ci).trim(), v = rest.slice(ci + 1).trim();
            var obj = {};
            obj[k] = v ? scalar(v) : parseBlock(listIndent + 2);
            while (i < lines.length && lines[i].indent > listIndent) {
              Object.assign(obj, parseMapEntry(listIndent + 1));
            }
            arr.push(obj);
          } else {
            arr.push(scalar(rest));
          }
        }
        return arr;
      }
      var map = {};
      var mapIndent = lines[i].indent;
      while (i < lines.length && lines[i].indent === mapIndent && lines[i].indent >= minIndent) {
        if (lines[i].text.indexOf("- ") === 0) break;
        Object.assign(map, parseMapEntry(mapIndent));
      }
      return map;
    }

    function parseMapEntry(mapIndent) {
      var l = lines[i++];
      var ci = l.text.indexOf(":");
      if (ci < 0) throw new Error("Line " + l.line + ": expected key: value");
      var k = l.text.slice(0, ci).trim();
      var v = l.text.slice(ci + 1).trim();
      var out = {};
      if (v === "|" || v === "|-") {
        var block = [];
        var baseIndent = -1;
        while (i < lines.length && lines[i].indent > mapIndent) {
          if (baseIndent < 0) baseIndent = lines[i].indent;
          block.push(lines[i].raw.slice(baseIndent));
          i++;
        }
        out[k] = block.join("\n");
      } else if (v) {
        out[k] = scalar(v);
      } else if (i < lines.length && lines[i].indent > mapIndent) {
        out[k] = parseBlock(mapIndent + 1);
      } else {
        out[k] = null;
      }
      return out;
    }

    return parseBlock(0);
  }

  function toYaml(val, indent) {
    indent = indent || 0;
    var pad = " ".repeat(indent);
    if (Array.isArray(val)) {
      return val.map(function (item) {
        if (item && typeof item === "object" && !Array.isArray(item)) {
          var keys = Object.keys(item);
          if (!keys.length) return pad + "- {}";
          var first = keys[0];
          var head = pad + "- " + formatPair(first, item[first], indent + 2);
          var rest = keys.slice(1).map(function (k) {
            return " ".repeat(indent + 2) + formatPair(k, item[k], indent + 2);
          });
          return [head].concat(rest).join("\n");
        }
        return pad + "- " + formatScalar(item);
      }).join("\n");
    }
    if (val && typeof val === "object") {
      return Object.keys(val).filter(function (k) { return val[k] !== undefined && val[k] !== ""; }).map(function (k) {
        return pad + formatPair(k, val[k], indent);
      }).join("\n");
    }
    return pad + formatScalar(val);
  }

  function formatScalar(v) {
    if (typeof v === "boolean" || typeof v === "number") return String(v);
    if (v === null) return "null";
    var s = String(v);
    if (/[:#\n]|^\s|\s$/.test(s)) return JSON.stringify(s);
    return s;
  }

  function formatPair(k, v, indent) {
    if (typeof v === "string" && v.indexOf("\n") >= 0) {
      var pad = " ".repeat(indent + 2);
      return k + ": |\n" + v.split("\n").map(function (ln) { return pad + ln; }).join("\n");
    }
    if (v && typeof v === "object") {
      return k + ":\n" + toYaml(v, indent + 2);
    }
    return k + ": " + formatScalar(v);
  }

  function st(id, state, attrs) {
    return { entity_id: id, state: state, attributes: attrs || {}, last_changed: new Date().toISOString(), last_updated: new Date().toISOString() };
  }
  var states = {
    "weather.home": st("weather.home", "partlycloudy", { temperature: 21.4, temperature_unit: "°C", friendly_name: "Weather" }),
    "sensor.house_power": st("sensor.house_power", "612", { unit_of_measurement: "W", device_class: "power", friendly_name: "Power" }),
    "binary_sensor.living_motion": st("binary_sensor.living_motion", "off", { device_class: "motion", friendly_name: "Living motion" }),
    "binary_sensor.front_door": st("binary_sensor.front_door", "off", { device_class: "door", friendly_name: "Front door" }),
    "light.living_room": st("light.living_room", "on", { friendly_name: "Living room" })
  };
  var dark = true;
  var hass = {
    states: states,
    user: { name: "Alex Smith" },
    language: "en",
    locale: { language: "en" },
    themes: { darkMode: dark },
    callService: function (d, s, data) {
      var id = data && data.entity_id;
      if (id && states[id]) {
        states[id].state = states[id].state === "on" ? "off" : "on";
        card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
      }
      return Promise.resolve();
    }
  };

  var card = document.getElementById("card");
  var yamlInput = document.getElementById("yaml-input");
  var yamlErr = document.getElementById("yaml-err");
  var els = {
    world: document.getElementById("ed-world"),
    effect: document.getElementById("ed-effect"),
    theme: document.getElementById("ed-theme"),
    weather: document.getElementById("ed-weather"),
    name: document.getElementById("ed-name"),
    clock: document.getElementById("ed-clock"),
    date: document.getElementById("ed-date"),
    tag: document.getElementById("ed-tag"),
    h24: document.getElementById("ed-24h")
  };

  // Populate world and effect dropdowns from loaded card registries
  Object.keys(window.AMB.W).forEach(function (id) {
    var o = document.createElement("option");
    o.value = id;
    o.textContent = window.AMB.W[id].name + " (" + id + ")";
    els.world.appendChild(o);
  });
  [{ id: "auto", name: "Auto (from weather)" }, { id: "none", name: "None" }].concat(
    Object.keys(window.FX.E).map(function (id) { return { id: id, name: window.FX.E[id].name + " (" + id + ")" }; })
  ).forEach(function (item) {
    var o = document.createElement("option");
    o.value = item.id;
    o.textContent = item.name;
    els.effect.appendChild(o);
  });

  var currentCfg = {};

  function syncFormFromConfig(cfg) {
    els.world.value = cfg.world || "casetta";
    els.effect.value = cfg.effect || "auto";
    els.theme.value = cfg.theme || "auto";
    els.weather.value = cfg.weather_entity || "";
    els.name.value = cfg.name || "";
    els.clock.checked = cfg.show_clock !== false;
    els.date.checked = cfg.show_date !== false;
    els.tag.checked = cfg.show_world_tag !== false;
    els.h24.checked = cfg.hour_24 !== false;
  }

  function applyConfig(cfg, updateYaml) {
    currentCfg = cfg;
    if (updateYaml) yamlInput.value = toYaml(cfg);
    card.setConfig(cfg);
    card.hass = hass;
  }

  function applyYaml() {
    try {
      var cfg = parseYaml(yamlInput.value);
      yamlErr.textContent = "";
      syncFormFromConfig(cfg);
      applyConfig(cfg, false);
    } catch (e) {
      yamlErr.textContent = e.message;
    }
  }

  function onFormChange() {
    var next = Object.assign({}, currentCfg, {
      world: els.world.value,
      effect: els.effect.value,
      theme: els.theme.value,
      weather_entity: els.weather.value.trim() || undefined,
      name: els.name.value.trim() || undefined,
      show_clock: els.clock.checked,
      show_date: els.date.checked,
      show_world_tag: els.tag.checked,
      hour_24: els.h24.checked
    });
    yamlErr.textContent = "";
    applyConfig(next, true);
  }

  Object.keys(els).forEach(function (k) {
    var ev = els[k].tagName === "INPUT" && els[k].type === "text" || els[k].tagName === "TEXTAREA" ? "input" : "change";
    els[k].addEventListener(ev, onFormChange);
  });

  var yamlTimer = 0;
  yamlInput.addEventListener("input", function () {
    clearTimeout(yamlTimer);
    yamlTimer = setTimeout(applyYaml, 200);
  });
  document.getElementById("apply-yaml").addEventListener("click", applyYaml);

  document.getElementById("toggle-theme").addEventListener("click", function () {
    dark = !dark;
    document.body.style.background = dark ? "#0b1020" : "#edf0fa";
    document.body.style.color = dark ? "#e2e8f0" : "#1e293b";
    hass = Object.assign({}, hass, { themes: { darkMode: dark } });
    card.hass = hass;
  });

  function toggleBinary(id) {
    states[id].state = states[id].state === "on" ? "off" : "on";
    card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
  }

  document.getElementById("toggle-rain").addEventListener("click", function () {
    states["weather.home"].state = states["weather.home"].state === "rainy" ? "partlycloudy" : "rainy";
    card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
  });
  document.getElementById("toggle-light").addEventListener("click", function () { toggleBinary("light.living_room"); });
  document.getElementById("toggle-door").addEventListener("click", function () { toggleBinary("binary_sensor.front_door"); });
  document.getElementById("toggle-motion").addEventListener("click", function () { toggleBinary("binary_sensor.living_motion"); });

  applyYaml();
</script>
</body>
</html>
